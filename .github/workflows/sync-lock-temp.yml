name: temporary branch validation

on:
  push:
    branches: [fix/mcp-wait-cancellation]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run and record full branch validation
        run: |
          if test -f .branch-ci-result; then
            cat .branch-ci-result
            exit 0
          fi

          : > .branch-ci-log
          overall=0
          run_check() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" >> .branch-ci-log
            "$@" >> .branch-ci-log 2>&1
            rc=$?
            printf '\nexit=%s\n' "$rc" >> .branch-ci-log
            if test "$rc" -ne 0; then
              overall=1
            fi
          }

          run_check "install frozen" pnpm install --frozen-lockfile
          if test "$overall" -eq 0; then
            run_check "typecheck and test" pnpm check
            run_check "repository contract" pnpm check:repo-contract
            run_check "CLI package" pnpm check:cli-package
            run_check "browser JS" bash -lc "find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check"
            run_check "agent discovery" bash -lc "test -s apps/web/public/agent.md && test -s apps/web/public/llms.txt && test -s apps/web/public/skills/waitloop/SKILL.md && node -e \"JSON.parse(require('node:fs').readFileSync('apps/web/public/agent.json', 'utf8'))\""
            run_check "Worker dry run" pnpm exec wrangler deploy --dry-run --outdir .wrangler-dist
          fi

          if test "$overall" -eq 0; then
            printf '%s\n' "passed" > .branch-ci-result
          else
            printf '%s\n' "failed" > .branch-ci-result
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .branch-ci-result .branch-ci-log
          git commit -m "chore: record temporary branch validation"
          git push origin HEAD:fix/mcp-wait-cancellation

          exit "$overall"
