name: temporary lockfile sync

on:
  push:
    branches: [fix/mcp-wait-cancellation]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore base lock and add only CLI importer
        env:
          BASE_SHA: 8f07bc3f2e8adcd8d0d696f40af9585b162c108a
        run: |
          git show "${BASE_SHA}:pnpm-lock.yaml" > pnpm-lock.yaml
          python3 <<'PY'
          from pathlib import Path
          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          old = "  packages/cli: {}\n"
          new = """  packages/cli:\n    dependencies:\n      '@modelcontextprotocol/server':\n        specifier: 2.0.0\n        version: 2.0.0\n"""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one packages/cli importer")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore: keep lockfile update scoped"
          git push origin HEAD:fix/mcp-wait-cancellation
