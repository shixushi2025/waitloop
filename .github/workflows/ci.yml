name: ci

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: write
  checks: read

jobs:
  patch-room-update:
    name: patch-room-update
    if: (github.ref == 'refs/heads/fix/wait-for-room-update' || github.head_ref == 'fix/wait-for-room-update') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/wait-for-room-update
          fetch-depth: 20

      - name: Recover and apply staged patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = ".github/workflows/patch-wait-for-room-update-temp.yml"
          staged_commit = "9ff013a9c9238d153c1bf3b83866dc356fa1475c"
          previous = subprocess.check_output(
              ["git", "show", f"{staged_commit}:{workflow_path}"],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in previous or end_marker not in previous:
              raise SystemExit("could not recover the staged Python patch")
          block = previous.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          script = "\n".join(lines) + "\n"

          label = '"AGENTS local source tools"'
          label_at = script.find(label)
          if label_at < 0:
              raise SystemExit("missing AGENTS local tool patch label")
          block_start = script.rfind("replace_once(", 0, label_at)
          block_end = script.find("\n)", label_at)
          if block_start < 0 or block_end < 0:
              raise SystemExit("could not isolate AGENTS local tool patch")
          block_end += 2
          agents_patch = script[block_start:block_end]
          old_prefix = "'get_turn()\\nwait_for_turn(timeoutMs?)\\nplay_move(expectedRevision, moveId)'"
          new_prefix = "'leave_room()\\nget_turn()\\nwait_for_turn(timeoutMs?)\\nplay_move(expectedRevision, moveId)'"
          old_result = "'get_turn()\\nwait_for_turn(timeoutMs?)\\nwait_for_room_update(afterRoomSeq, timeoutMs?)\\nplay_move(expectedRevision, moveId)'"
          new_result = "'leave_room()\\nget_turn()\\nwait_for_turn(timeoutMs?)\\nwait_for_room_update(afterRoomSeq, timeoutMs?)\\nplay_move(expectedRevision, moveId)'"
          if agents_patch.count(old_prefix) != 1 or agents_patch.count(old_result) != 1:
              raise SystemExit("AGENTS local tool patch has unexpected shape")
          agents_patch = agents_patch.replace(old_prefix, new_prefix, 1).replace(old_result, new_result, 1)
          script = script[:block_start] + agents_patch + script[block_end:]
          Path("/tmp/waitloop-room-update-patch.py").write_text(script)
          PY

          python3 /tmp/waitloop-room-update-patch.py
          rm -f .wait-room-update-patch-trigger
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded Room update waiting"
          git push origin HEAD:fix/wait-for-room-update

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare CI gate
        run: pnpm check:cloudflare-gate

      - name: Typecheck and test
        run: pnpm check

      - name: Validate repository contract
        run: pnpm check:repo-contract

      - name: Validate CLI npm package
        run: pnpm check:cli-package

      - name: Validate packaged MCP stdio bridge
        run: pnpm check:mcp-stdio

      - name: Validate browser JavaScript
        run: find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate agent discovery files
        run: |
          test -s apps/web/public/agent.md
          test -s apps/web/public/llms.txt
          test -s apps/web/public/skills/waitloop/SKILL.md
          node -e "JSON.parse(require('node:fs').readFileSync('apps/web/public/agent.json', 'utf8'))"

      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dist

  verify-cloudflare-gate:
    name: verify-cloudflare-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify gate against completed check run
        env:
          WORKERS_CI: "1"
          WORKERS_CI_BRANCH: main
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WAITLOOP_REQUIRED_CHECK_NAME: check
          WAITLOOP_GITHUB_TOKEN: ${{ github.token }}
          WAITLOOP_CI_GATE_TIMEOUT_MS: "120000"
          WAITLOOP_CI_GATE_POLL_MS: "5000"
        run: node scripts/cloudflare-ci-gate.mjs

  ready-to-deploy:
    name: ready-to-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - verify-cloudflare-gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CHECK_RESULT: ${{ needs.check.result }}
      GATE_RESULT: ${{ needs.verify-cloudflare-gate.result }}
    steps:
      - name: Require complete green validation
        run: |
          test "$CHECK_RESULT" = "success"
          test "$GATE_RESULT" = "success"
          echo "This commit is ready for Cloudflare production deployment."
