name: ci

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare CI gate
        run: pnpm check:cloudflare-gate

      - name: Typecheck and test
        run: pnpm check

      - name: Validate repository contract
        run: pnpm check:repo-contract

      - name: Validate CLI npm package
        run: pnpm check:cli-package

      - name: Validate packaged MCP stdio bridge
        run: pnpm check:mcp-stdio

      - name: Validate browser JavaScript
        run: find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate agent discovery files
        run: |
          test -s apps/web/public/agent.md
          test -s apps/web/public/llms.txt
          test -s apps/web/public/skills/waitloop/SKILL.md
          node -e "JSON.parse(require('node:fs').readFileSync('apps/web/public/agent.json', 'utf8'))"

      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dist

  verify-cloudflare-gate:
    name: verify-cloudflare-gate
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify gate against completed check run
        env:
          WORKERS_CI: "1"
          WORKERS_CI_BRANCH: main
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WAITLOOP_REQUIRED_CHECK_NAME: check
          WAITLOOP_GITHUB_TOKEN: ${{ github.token }}
          WAITLOOP_CI_GATE_TIMEOUT_MS: "120000"
          WAITLOOP_CI_GATE_POLL_MS: "5000"
        run: node scripts/cloudflare-ci-gate.mjs

  ready-to-deploy:
    name: ready-to-deploy
    if: always()
    needs:
      - check
      - verify-cloudflare-gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CHECK_RESULT: ${{ needs.check.result }}
      GATE_RESULT: ${{ needs.verify-cloudflare-gate.result }}
    steps:
      - name: Require complete green validation
        run: |
          test "$CHECK_RESULT" = "success"
          test "$GATE_RESULT" = "success"
          echo "This commit is ready for Cloudflare production deployment."

  record-cloudflare-gate-verification:
    if: always() && github.ref == 'refs/heads/fix/cloudflare-ci-gate-verify'
    needs: ready-to-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEPLOY_RESULT: ${{ needs.ready-to-deploy.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record final gate result
        run: |
          printf '%s\n' "$DEPLOY_RESULT" > .official-ci.result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .official-ci.result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Cloudflare gate validation"
          git push origin HEAD:fix/cloudflare-ci-gate-verify

  verify-main-cloudflare-deployment:
    if: always() && github.ref == 'refs/heads/fix/cloudflare-ci-gate-verify'
    needs: record-cloudflare-gate-verification
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: write
      checks: read
      statuses: read
    env:
      TARGET_SHA: 4d7d73d9ba51d5960be1deaf0b1b6bd5dbd61916
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Observe actual main deployment checks
        run: |
          if test -f .main-deploy.result; then
            cat .main-deploy.result
            exit 0
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const owner = 'shixushi2025';
          const repo = 'waitloop';
          const sha = process.env.TARGET_SHA;
          const token = process.env.GITHUB_TOKEN;
          const deadline = Date.now() + 15 * 60 * 1000;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${token}`,
            'user-agent': 'waitloop-main-deployment-verifier',
            'x-github-api-version': '2026-03-10',
          };

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const lower = (value) => String(value ?? '').toLowerCase();
          const terminalFailure = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale']);

          async function json(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            return response.json();
          }

          function latest(items, key = 'id') {
            return [...items].sort((a, b) => Number(b?.[key] ?? 0) - Number(a?.[key] ?? 0))[0] ?? null;
          }

          let final = null;
          while (Date.now() <= deadline) {
            const [checksBody, statusBody] = await Promise.all([
              json(`https://api.github.com/repos/${owner}/${repo}/commits/${sha}/check-runs?filter=all&per_page=100`),
              json(`https://api.github.com/repos/${owner}/${repo}/commits/${sha}/status`),
            ]);
            const checks = Array.isArray(checksBody.check_runs) ? checksBody.check_runs : [];
            const statuses = Array.isArray(statusBody.statuses) ? statusBody.statuses : [];

            const ready = latest(checks.filter((run) =>
              run?.name === 'ready-to-deploy' && run?.head_sha === sha && run?.app?.slug === 'github-actions'));
            const cloudflareChecks = checks.filter((run) =>
              run?.head_sha === sha && lower(`${run?.name} ${run?.app?.slug}`).includes('cloudflare'));
            const cloudflareStatuses = statuses.filter((status) => lower(status?.context).includes('cloudflare'));
            const cloudflareCheck = latest(cloudflareChecks);
            const cloudflareStatus = cloudflareStatuses[0] ?? null;

            const readySuccess = ready?.status === 'completed' && ready?.conclusion === 'success';
            const cloudflareCheckSuccess = cloudflareCheck?.status === 'completed' && cloudflareCheck?.conclusion === 'success';
            const cloudflareStatusSuccess = cloudflareStatus?.state === 'success';

            const snapshot = {
              version: 1,
              observedAt: new Date().toISOString(),
              targetSha: sha,
              readyToDeploy: ready ? {
                id: ready.id,
                status: ready.status,
                conclusion: ready.conclusion,
                completedAt: ready.completed_at,
                detailsUrl: ready.details_url,
              } : null,
              cloudflareCheck: cloudflareCheck ? {
                id: cloudflareCheck.id,
                name: cloudflareCheck.name,
                app: cloudflareCheck.app?.slug,
                status: cloudflareCheck.status,
                conclusion: cloudflareCheck.conclusion,
                startedAt: cloudflareCheck.started_at,
                completedAt: cloudflareCheck.completed_at,
                detailsUrl: cloudflareCheck.details_url,
              } : null,
              cloudflareStatus: cloudflareStatus ? {
                id: cloudflareStatus.id,
                context: cloudflareStatus.context,
                state: cloudflareStatus.state,
                createdAt: cloudflareStatus.created_at,
                updatedAt: cloudflareStatus.updated_at,
                targetUrl: cloudflareStatus.target_url,
              } : null,
            };

            if (ready?.status === 'completed' && terminalFailure.has(ready?.conclusion)) {
              final = { ...snapshot, result: 'failure', reason: `ready-to-deploy:${ready.conclusion}` };
              break;
            }
            if (cloudflareCheck?.status === 'completed' && terminalFailure.has(cloudflareCheck?.conclusion)) {
              final = { ...snapshot, result: 'failure', reason: `cloudflare-check:${cloudflareCheck.conclusion}` };
              break;
            }
            if (cloudflareStatus && ['failure', 'error'].includes(cloudflareStatus.state)) {
              final = { ...snapshot, result: 'failure', reason: `cloudflare-status:${cloudflareStatus.state}` };
              break;
            }
            if (readySuccess && (cloudflareCheckSuccess || cloudflareStatusSuccess)) {
              final = { ...snapshot, result: 'success', reason: cloudflareCheckSuccess ? 'cloudflare-check-success' : 'cloudflare-status-success' };
              break;
            }

            fs.writeFileSync('.main-deploy.json', `${JSON.stringify({ ...snapshot, result: 'waiting' }, null, 2)}\n`);
            await sleep(15_000);
          }

          if (!final) {
            let last = null;
            try { last = JSON.parse(fs.readFileSync('.main-deploy.json', 'utf8')); } catch {}
            final = {
              ...(last ?? { version: 1, targetSha: sha }),
              observedAt: new Date().toISOString(),
              result: 'timeout',
              reason: 'cloudflare-check-not-observed-within-15-minutes',
            };
          }

          fs.writeFileSync('.main-deploy.json', `${JSON.stringify(final, null, 2)}\n`);
          fs.writeFileSync('.main-deploy.result', `${final.result}\n`);
          console.log(JSON.stringify(final, null, 2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .main-deploy.result .main-deploy.json
          git commit -m "chore: record actual main Cloudflare deployment"
          git push origin HEAD:fix/cloudflare-ci-gate-verify
