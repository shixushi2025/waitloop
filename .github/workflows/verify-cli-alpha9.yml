name: verify-cli-alpha9

on:
  workflow_run:
    workflows: [publish-cli]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: verify-cli-alpha9
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use current npm
        run: npm install --global npm@11

      - name: Verify exact source authorization
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const marker = fs.readFileSync('.github/publish-cli-alpha9', 'utf8').trim();
          if (pkg.version !== '0.1.0-alpha.9' || marker !== pkg.version) {
            console.error(`Expected the alpha.9 package and marker, found package=${pkg.version} marker=${marker}.`);
            process.exit(1);
          }
          NODE

      - name: Verify npm version and alpha dist-tag
        run: |
          VERSION="0.1.0-alpha.9"
          for attempt in 1 2 3 4 5 6; do
            exact="$(npm view "@waitloop/cli@${VERSION}" version 2>/dev/null || true)"
            tagged="$(npm view "@waitloop/cli" dist-tags.alpha 2>/dev/null || true)"
            if [ "$exact" = "$VERSION" ] && [ "$tagged" = "$VERSION" ]; then
              echo "Verified @waitloop/cli@${VERSION} and @waitloop/cli@alpha."
              exit 0
            fi
            sleep 5
          done
          echo "npm did not expose the expected exact version and alpha dist-tag." >&2
          exit 1

      - name: Validate clean installation and packaged MCP bridge
        run: |
          PREFIX="$RUNNER_TEMP/waitloop-alpha9-witness"
          npm install --global --prefix "$PREFIX" "@waitloop/cli@0.1.0-alpha.9"
          test "$("$PREFIX/bin/waitloop" --version)" = "0.1.0-alpha.9"
          WAITLOOP_CLI_ENTRY="$PREFIX/lib/node_modules/@waitloop/cli/dist/index.js" node scripts/validate-mcp-stdio.mjs

      - name: Record verified release tag
        env:
          RELEASE_TAG: cli-v0.1.0-alpha.9
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin --tags
          existing="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
            echo "$RELEASE_TAG already records the verified release commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "@waitloop/cli 0.1.0-alpha.9"
          git push origin "refs/tags/$RELEASE_TAG"
