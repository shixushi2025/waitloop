name: temporary wait_for_room_update patch

on:
  push:
    branches: [fix/wait-for-room-update]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/wait-for-room-update

      - name: Apply bounded Room-update wait
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          def insert_after(path: str, marker: str, addition: str, label: str) -> None:
              replace_once(path, marker, marker + addition, label)

          Path("worker/src/wait-for-room-update.ts").write_text('''export type WaitForRoomUpdateReasonV1 = "room_updated" | "game_finished";\n\nexport type WaitForRoomUpdateClassificationV1 =\n  | WaitForRoomUpdateReasonV1\n  | "cursor_ahead"\n  | null;\n\nexport interface WaitForRoomUpdateSnapshotV1 {\n  roomSeq: number;\n  status: string;\n  roomPhase: string;\n}\n\nexport function normalizeAfterRoomSeq(value: number): number {\n  if (!Number.isSafeInteger(value) || value < 0) {\n    throw new Error("afterRoomSeq must be a non-negative integer.");\n  }\n  return value;\n}\n\nexport function classifyWaitForRoomUpdate(\n  snapshot: WaitForRoomUpdateSnapshotV1,\n  afterRoomSeq: number,\n): WaitForRoomUpdateClassificationV1 {\n  const cursor = normalizeAfterRoomSeq(afterRoomSeq);\n  if (!Number.isSafeInteger(snapshot.roomSeq) || snapshot.roomSeq < 1) {\n    throw new Error("Room snapshot has an invalid roomSeq.");\n  }\n  if (cursor > snapshot.roomSeq) return "cursor_ahead";\n  if (snapshot.roomPhase === "finished" || snapshot.status === "finished") return "game_finished";\n  if (snapshot.roomSeq > cursor) return "room_updated";\n  return null;\n}\n''')

          Path("worker/src/wait-for-room-update.test.ts").write_text('''import { readFileSync } from "node:fs";\n\nimport { describe, expect, it } from "vitest";\n\nimport {\n  classifyWaitForRoomUpdate,\n  normalizeAfterRoomSeq,\n  type WaitForRoomUpdateSnapshotV1,\n} from "./wait-for-room-update";\n\nfunction snapshot(overrides: Partial<WaitForRoomUpdateSnapshotV1> = {}): WaitForRoomUpdateSnapshotV1 {\n  return { roomSeq: 7, status: "playing", roomPhase: "playing", ...overrides };\n}\n\ndescribe("wait_for_room_update cursor classification", () => {\n  it("returns when a newer semantic Room event exists", () => {\n    expect(classifyWaitForRoomUpdate(snapshot({ roomSeq: 8 }), 7)).toBe("room_updated");\n  });\n\n  it("keeps waiting while the semantic cursor is unchanged", () => {\n    expect(classifyWaitForRoomUpdate(snapshot(), 7)).toBeNull();\n  });\n\n  it("returns a terminal Room even when the cursor is already current", () => {\n    expect(classifyWaitForRoomUpdate(snapshot({ status: "finished", roomPhase: "finished" }), 7)).toBe("game_finished");\n  });\n\n  it("rejects a client cursor that is ahead of the authoritative Room", () => {\n    expect(classifyWaitForRoomUpdate(snapshot(), 8)).toBe("cursor_ahead");\n  });\n\n  it("accepts zero for an initial full snapshot and rejects invalid cursors", () => {\n    expect(normalizeAfterRoomSeq(0)).toBe(0);\n    expect(classifyWaitForRoomUpdate(snapshot(), 0)).toBe("room_updated");\n    expect(() => normalizeAfterRoomSeq(-1)).toThrow(/non-negative/);\n    expect(() => normalizeAfterRoomSeq(1.5)).toThrow(/integer/);\n  });\n\n  it("rejects malformed Room snapshots", () => {\n    expect(() => classifyWaitForRoomUpdate(snapshot({ roomSeq: 0 }), 0)).toThrow(/invalid roomSeq/);\n  });\n\n  it("is registered as a bounded remote MCP tool using the semantic cursor", () => {\n    const source = readFileSync(new URL("./mcp.ts", import.meta.url), "utf8");\n    expect(source).toContain('"wait_for_room_update"');\n    expect(source).toContain("afterRoomSeq");\n    expect(source).toContain("room_seq_ahead");\n    expect(source).toContain("normalizeWaitForTurnTimeout");\n    expect(source).toContain("WAIT_FOR_TURN_POLL_MS");\n  });\n});\n''')

          replace_once(
              "worker/src/mcp.ts",
              '} from "./wait-for-turn";\n\ninterface McpEnv {',
              '} from "./wait-for-turn";\nimport {\n  classifyWaitForRoomUpdate,\n  normalizeAfterRoomSeq,\n} from "./wait-for-room-update";\n\ninterface McpEnv {',
              "remote wait import",
          )

          room_wait_tool = '''\n    server.registerTool(\n      "wait_for_room_update",\n      {\n        description:\n          "Wait for a semantic Room change after one roomSeq cursor. Controllers and advisors may use it; it does not grant play authority. timeoutMs bounds only this cancellable tool call and cannot wake an Agent run after it has ended.",\n        inputSchema: z.object({\n          afterRoomSeq: z.number().int().nonnegative(),\n          timeoutMs: z.number().int().min(1_000).max(25_000).optional(),\n        }),\n      },\n      async ({ afterRoomSeq, timeoutMs }, ctx) => {\n        let cursor: number;\n        try {\n          cursor = normalizeAfterRoomSeq(afterRoomSeq);\n        } catch (error) {\n          return errorResult(\n            "invalid_room_seq_cursor",\n            error instanceof Error ? error.message : "Invalid Room event cursor.",\n          );\n        }\n\n        let boundedTimeout: number;\n        try {\n          boundedTimeout = normalizeWaitForTurnTimeout(timeoutMs);\n        } catch (error) {\n          return errorResult("invalid_wait_timeout", error instanceof Error ? error.message : "Invalid wait timeout.");\n        }\n\n        const signal = ctx.mcpReq.signal;\n        const startedAt = Date.now();\n        while (true) {\n          throwIfWaitCancelled(signal);\n          const result = await room.getSnapshotBySeatToken(seatToken);\n          if (!result.ok) return errorResult(result.error.code, result.error.message);\n          const snapshot = rpcValue(result) as GameRoomSnapshotV1;\n          const reason = classifyWaitForRoomUpdate(snapshot, cursor);\n          if (reason === "cursor_ahead") {\n            return errorResult(\n              "room_seq_ahead",\n              `afterRoomSeq ${cursor} is ahead of current roomSeq ${snapshot.roomSeq}. Refresh with get_turn before waiting again.`,\n            );\n          }\n          if (reason) {\n            return textResult({\n              version: 1,\n              reason,\n              waitedMs: Date.now() - startedAt,\n              afterRoomSeq: cursor,\n              roomSeq: snapshot.roomSeq,\n              snapshot,\n            });\n          }\n\n          const elapsed = Date.now() - startedAt;\n          if (elapsed >= boundedTimeout) {\n            return textResult({\n              version: 1,\n              reason: "timeout",\n              waitedMs: elapsed,\n              afterRoomSeq: cursor,\n              roomSeq: snapshot.roomSeq,\n              stillWaiting: true,\n              snapshot,\n            });\n          }\n          await waitForTurnDelay(Math.min(WAIT_FOR_TURN_POLL_MS, boundedTimeout - elapsed), signal);\n        }\n      },\n    );\n'''
          replace_once(
              "worker/src/mcp.ts",
              '\n    server.registerTool(\n      "play_move",',
              room_wait_tool + '\n    server.registerTool(\n      "play_move",',
              "remote Room wait tool",
          )
          replace_once(
              "worker/src/mcp.ts",
              '          "Post a short room comment as this connected actor. Comments are a side channel: they never mutate game rules, turn order, or room revision.",',
              '          "Post a short room comment as this connected actor. Comments are a side channel: they never mutate game rules, turn order, or game revision, but they advance roomSeq for Room observers.",',
              "comment roomSeq description",
          )

          replace_once(
              "packages/cli/src/mcp-bridge.ts",
              'Use join_room() with a WL code for an existing Agent seat, then use wait_for_turn instead of polling.',
              'Use join_room() with a WL code for an existing Agent seat, then use wait_for_turn instead of polling for Controller turns. Advisors and other observers should use wait_for_room_update(afterRoomSeq) for semantic Room changes while the current Agent run remains active.',
              "local instructions",
          )

          local_wait_tool = '''  {\n    name: "wait_for_room_update",\n    description:\n      "Wait for any semantic Room change after the supplied roomSeq. Works for Controllers and Advisors without granting play authority. timeoutMs bounds only this cancellable call; an ended Agent run cannot be woken by MCP.",\n    inputSchema: {\n      type: "object",\n      properties: {\n        afterRoomSeq: {\n          type: "integer",\n          minimum: 0,\n          description: "Last semantic Room cursor already observed; use 0 to request the current snapshot immediately.",\n        },\n        timeoutMs: { type: "integer", minimum: 1000, maximum: 25000, default: 25000 },\n      },\n      required: ["afterRoomSeq"],\n      additionalProperties: false,\n    },\n  },\n'''
          replace_once(
              "packages/cli/src/mcp-bridge.ts",
              '  {\n    name: "play_move",',
              local_wait_tool + '  {\n    name: "play_move",',
              "local Room wait tool",
          )
          insert_after(
              "packages/cli/src/mcp-bridge.ts",
              'function requiredRevision(args: Record<string, unknown>): number {\n  const value = args.expectedRevision;\n  if (!Number.isSafeInteger(value) || (value as number) < 0) throw new Error("expectedRevision must be a non-negative integer.");\n  return value as number;\n}\n',
              '\nfunction requiredRoomSeq(args: Record<string, unknown>): number {\n  const value = args.afterRoomSeq;\n  if (!Number.isSafeInteger(value) || (value as number) < 0) throw new Error("afterRoomSeq must be a non-negative integer.");\n  return value as number;\n}\n',
              "local room cursor parser",
          )
          replace_once(
              "packages/cli/src/mcp-bridge.ts",
              '  return name === "get_turn" || name === "wait_for_turn" || name === "ui_get_game" || name === "ui_hint"',
              '  return name === "get_turn" || name === "wait_for_turn" || name === "wait_for_room_update" || name === "ui_get_game" || name === "ui_hint"',
              "local cancellation allowlist",
          )
          replace_once(
              "packages/cli/src/mcp-bridge.ts",
              '  if (name === "play_move") {',
              '  if (name === "wait_for_room_update") {\n    const timeoutMs = args.timeoutMs;\n    if (timeoutMs !== undefined && (!Number.isSafeInteger(timeoutMs) || (timeoutMs as number) < 1_000 || (timeoutMs as number) > 25_000)) {\n      throw new Error("timeoutMs must be an integer between 1000 and 25000.");\n    }\n    return callActiveRoomTool(\n      "wait_for_room_update",\n      {\n        afterRoomSeq: requiredRoomSeq(args),\n        ...(timeoutMs === undefined ? {} : { timeoutMs }),\n      },\n      signalForRemoteRead(name, signal),\n    );\n  }\n  if (name === "play_move") {',
              "local Room wait proxy",
          )

          replace_once(
              "packages/cli/test/mcp-bridge.test.ts",
              '      "wait_for_turn",\n      "play_move",',
              '      "wait_for_turn",\n      "wait_for_room_update",\n      "play_move",',
              "local bridge expected tools",
          )
          insert_after(
              "packages/cli/test/mcp-bridge.test.ts",
              '    expect(JSON.stringify(LOCAL_MCP_TOOLS)).not.toContain("wlview_");\n',
              '\n    const roomWait = LOCAL_MCP_TOOLS.find((tool) => tool.name === "wait_for_room_update");\n    expect(roomWait?.inputSchema.required).toEqual(["afterRoomSeq"]);\n    expect(JSON.stringify(roomWait?.inputSchema)).toContain("afterRoomSeq");\n',
              "local bridge Room wait schema test",
          )
          insert_after(
              "packages/cli/test/mcp-bridge.test.ts",
              '    expect(LOCAL_MCP_INSTRUCTIONS).toContain("wait_for_turn");\n',
              '    expect(LOCAL_MCP_INSTRUCTIONS).toContain("wait_for_room_update");\n',
              "local bridge instructions test",
          )

          replace_once(
              "scripts/validate-mcp-stdio.mjs",
              '    "wait_for_turn",\n    "play_move",',
              '    "wait_for_turn",\n    "wait_for_room_update",\n    "play_move",',
              "packaged MCP required tool",
          )

          replace_once(
              "scripts/validate-repository-contract.mjs",
              'const remoteTools = ["get_turn", "wait_for_turn", "play_move", "comment", "yield_to_bot", "take_control"];\nfor (const tool of remoteTools) requireIncludes("agent.json mcp.tools", manifest.mcp?.tools, tool);\n\nconst localTools = ["open_game", "create_room", "join_room", "get_active_room", "leave_room", ...remoteTools];\nfor (const tool of localTools) requireIncludes("agent.json localMcp.tools", manifest.localMcp?.tools, tool);',
              '''const publishedRemoteTools = ["get_turn", "wait_for_turn", "play_move", "comment", "yield_to_bot", "take_control"];\nconst sourceRemoteTools = ["get_turn", "wait_for_turn", "wait_for_room_update", "play_move", "comment", "yield_to_bot", "take_control"];\nfor (const tool of sourceRemoteTools) requireIncludes("agent.json mcp.tools", manifest.mcp?.tools, tool);\n\nconst publishedLocalTools = ["open_game", "create_room", "join_room", "get_active_room", "leave_room", ...publishedRemoteTools];\nconst sourceLocalTools = ["open_game", "create_room", "join_room", "get_active_room", "leave_room", ...sourceRemoteTools];\nif (packageVersion === publishedVersion) {\n  for (const tool of sourceLocalTools) requireIncludes("agent.json localMcp.tools", manifest.localMcp?.tools, tool);\n  if (manifest.localMcp?.candidateTools !== undefined) fail("published CLI state must not retain localMcp.candidateTools");\n} else {\n  for (const tool of publishedLocalTools) requireIncludes("agent.json published localMcp.tools", manifest.localMcp?.tools, tool);\n  for (const tool of sourceLocalTools) requireIncludes("agent.json source localMcp.candidateTools", manifest.localMcp?.candidateTools, tool);\n}''',
              "published/source tool truth",
          )
          validator = Path("scripts/validate-repository-contract.mjs").read_text()
          validator = validator.replace(
              '  "wait_for_turn",\n  "play_move(expectedRevision, moveId)",',
              '  "wait_for_turn",\n  "wait_for_room_update",\n  "play_move(expectedRevision, moveId)",',
          )
          validator = validator.replace(
              '  "wait_for_turn",\n  "yield_to_bot()",',
              '  "wait_for_turn",\n  "wait_for_room_update",\n  "yield_to_bot()",',
          )
          if validator.count('"wait_for_room_update"') < 5:
              raise SystemExit("repository validator did not acquire expected Room wait checks")
          Path("scripts/validate-repository-contract.mjs").write_text(validator)

          onboarding = Path("scripts/validate-onboarding-contract.mjs").read_text()
          onboarding = onboarding.replace(
              '  "result `_meta`",\n]) requireText("apps/web/public/agent.md", needle);',
              '  "result `_meta`",\n  "wait_for_room_update",\n]) requireText("apps/web/public/agent.md", needle);',
          )
          onboarding = onboarding.replace(
              '  "tool-result `_meta`",\n]) requireText("apps/web/public/skills/waitloop/SKILL.md", needle);',
              '  "tool-result `_meta`",\n  "wait_for_room_update",\n]) requireText("apps/web/public/skills/waitloop/SKILL.md", needle);',
          )
          onboarding = onboarding.replace(
              '  "tool-result `_meta`",\n]) requireText("apps/web/public/llms.txt", needle);',
              '  "tool-result `_meta`",\n  "wait_for_room_update",\n]) requireText("apps/web/public/llms.txt", needle);',
          )
          onboarding = onboarding.replace(
              '    "tool result _meta",\n  ]],',
              '    "tool result _meta",\n    "wait_for_room_update",\n  ]],',
          )
          onboarding = onboarding.replace(
              '    "compatibility matrix",\n  ]],',
              '    "compatibility matrix",\n    "wait_for_room_update",\n  ]],',
          )
          Path("scripts/validate-onboarding-contract.mjs").write_text(onboarding)

          manifest_path = Path("apps/web/public/agent.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["cli"]["candidateSummary"] = (
              "Human-vs-bots MCP Apps are response-driven with zero periodic reads; snapshots add semantic roomSeq, "
              "and alpha.9 adds bounded cancellable wait_for_room_update for Controllers and Advisors. Push subscription transport remains future work."
          )
          source_remote = [
              "get_turn", "wait_for_turn", "wait_for_room_update", "play_move", "comment", "yield_to_bot", "take_control"
          ]
          manifest["mcp"]["tools"] = source_remote
          manifest["mcp"]["roomUpdateBehavior"] = (
              "wait_for_room_update(afterRoomSeq, timeoutMs?) waits 1-25 seconds for roomSeq to advance or the Room to finish; "
              "it is read-only, cancellable, Advisor-safe, and cannot wake an Agent run after final response"
          )
          manifest["localMcp"]["candidateTools"] = [
              "open_game", "create_room", "join_room", "get_active_room", "leave_room", *source_remote
          ]
          manifest["localMcp"]["candidateCancellation"] = (
              "alpha.9 additionally propagates caller cancellation through wait_for_room_update; all mutation-capable calls remain non-abortable mid-flight"
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          # Repository and public Agent surfaces distinguish installed alpha.8 from the alpha.9 source candidate.
          replace_once(
              "README.md",
              '### Full model-visible local surface\n\n```text\nopen_game()\ncreate_room()\njoin_room(code)\nget_active_room()\nleave_room()\nget_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```',
              '### Model-visible local surface\n\nThe published npm alpha.8 exposes:\n\n```text\nopen_game()\ncreate_room()\njoin_room(code)\nget_active_room()\nleave_room()\nget_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```\n\nThe alpha.9 source candidate additionally exposes:\n\n```text\nwait_for_room_update(afterRoomSeq, timeoutMs?)\n```',
              "README candidate tool surface",
          )
          insert_after(
              "README.md",
              'Remote/local Agent MCP provide `wait_for_turn()`. It returns on turn, finish, lobby, pause, Controller change, or a bounded transport timeout. Timeout never auto-passes or replaces a Casual Agent.\n',
              '\nRemote MCP and the alpha.9 local source candidate also provide `wait_for_room_update(afterRoomSeq, timeoutMs?)`. It waits for semantic `roomSeq` changes such as moves, comments, Controller transitions, and Room phase changes, so Advisors can observe without gaining `seat:play`. It remains a bounded current-run wait, not background wake-up or the final push transport.\n',
              "README Room wait",
          )

          replace_once(
              "packages/cli/README.md",
              'get_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)',
              'get_turn()\nwait_for_turn(timeoutMs?)\nwait_for_room_update(afterRoomSeq, timeoutMs?)\nplay_move(expectedRevision, moveId)',
              "CLI README source tool",
          )
          insert_after(
              "packages/cli/README.md",
              'Use `wait_for_turn()` instead of polling `get_turn()`. It returns on turn, finish, pause, lobby, Controller change, or a bounded transport timeout.\n',
              '\nUse `wait_for_room_update(afterRoomSeq, timeoutMs?)` when a Controller or Advisor needs any semantic Room change rather than only an actionable turn. It returns when `roomSeq` advances, the Room finishes, or the bounded call times out. It is cancellable and read-only, but it cannot restart an Agent after final response.\n',
              "CLI README Room wait",
          )

          replace_once(
              "docs/cli.md",
              'get_turn\nwait_for_turn\nplay_move',
              'get_turn\nwait_for_turn\nwait_for_room_update\nplay_move',
              "CLI docs source tools",
          )
          replace_once(
              "docs/cli.md",
              'Human MCP App refresh is different: the App periodically calls app-only `ui_get_game` through the Host while its iframe remains open. This does not wake an ended Agent run or create a game clock.',
              'Human MCP App refresh is different: the alpha.9 App is response-driven and performs no periodic `ui_get_game` calls. It refreshes only for explicit, one-shot lifecycle, stale-state, or uncertain-result recovery, and this still does not wake an ended Agent run.',
              "CLI docs response-driven correction",
          )
          insert_after(
              "docs/cli.md",
              'MCP is not a background scheduler: if an Agent returns its final response, no MCP server can spontaneously restart that run.\n',
              '\nFor companion and observation flows, `wait_for_room_update(afterRoomSeq, timeoutMs?)` waits for the semantic `roomSeq` cursor to advance or the Room to finish. It works for Advisors without granting Controller authority, propagates cancellation, and remains bounded to 25 seconds per call.\n',
              "CLI docs Room wait",
          )
          replace_once(
              "docs/cli.md",
              'get_turn\nwait_for_turn\nui_get_game',
              'get_turn\nwait_for_turn\nwait_for_room_update\nui_get_game',
              "CLI docs cancellation",
          )

          replace_once(
              "AGENTS.md",
              'get_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)',
              'get_turn()\nwait_for_turn(timeoutMs?)\nwait_for_room_update(afterRoomSeq, timeoutMs?)\nplay_move(expectedRevision, moveId)',
              "AGENTS local source tools",
          )
          replace_once(
              "AGENTS.md",
              'get_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```\n\nRoom ID, Actor token',
              'get_turn()\nwait_for_turn(timeoutMs?)\nwait_for_room_update(afterRoomSeq, timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```\n\nRoom ID, Actor token',
              "AGENTS remote tools",
          )
          insert_after(
              "AGENTS.md",
              'Continuous Agent play keeps the current run active through repeated `wait_for_turn -> play_move` until the requested condition. Human `open_game` play is driven by App clicks instead.\n',
              '\n## Wait-for-Room-update invariant\n\n`wait_for_room_update(afterRoomSeq, timeoutMs?)` is a bounded semantic-event wait for Controllers and Advisors. It uses authenticated private projection and `roomSeq`, returns on cursor advance, Room finish, or timeout, propagates cancellation, never grants `seat:play`, and cannot wake an Agent run after final response. A cursor ahead of the authoritative Room must fail and require `get_turn()` recovery. This bounded polling primitive is not the final WebSocket/subscription transport.\n',
              "AGENTS Room wait invariant",
          )
          replace_once(
              "AGENTS.md",
              'get_turn\nwait_for_turn\nui_get_game',
              'get_turn\nwait_for_turn\nwait_for_room_update\nui_get_game',
              "AGENTS cancellation",
          )

          replace_once(
              "apps/web/public/agent.md",
              '### Model-visible local tools\n\n```text\nopen_game(gameId?, mode?, roomId?)\ncreate_room()\njoin_room(code)\nget_active_room()\nleave_room()\nget_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```',
              '### Model-visible local tools\n\nThe published npm alpha.8 exposes:\n\n```text\nopen_game(gameId?, mode?, roomId?)\ncreate_room()\njoin_room(code)\nget_active_room()\nleave_room()\nget_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()\n```\n\nThe alpha.9 source candidate additionally exposes:\n\n```text\nwait_for_room_update(afterRoomSeq, timeoutMs?)\n```',
              "Agent guide candidate local tools",
          )
          insert_after(
              "apps/web/public/agent.md",
              '`get_turn()` remains available for an immediate snapshot. Do not tightly poll it when `wait_for_turn()` is available.\n',
              '\n## Semantic Room-update waiting\n\nRemote Room MCP and the alpha.9 local source candidate expose:\n\n```text\nwait_for_room_update({"afterRoomSeq":12,"timeoutMs":25000})\n```\n\nUse the last snapshot `roomSeq`, not game `revision`. It returns `room_updated` when a move, comment, Controller transition, Room phase, Join, or semantic presence event advances the cursor; it returns `game_finished` for a terminal Room and `timeout` when one bounded call expires. A cursor ahead of the authoritative Room fails with `room_seq_ahead`; recover with `get_turn()`. The tool is read-only, cancellable, and Advisor-safe, but it cannot wake an Agent run after the Agent has sent a final reply.\n',
              "Agent guide Room wait",
          )
          replace_once(
              "apps/web/public/agent.md",
              '`wait_for_turn()` is Controller/turn-oriented, not a general Room revision subscription. An Advisor that is bound to a Human-controlled Seat may receive `controller_changed` immediately instead of waiting for the next Human move. Do not claim that an Advisor is continuously monitoring the table merely because it is bound or connected, and do not promise background advice after the current Agent response ends. A future companion-specific Room-update wait primitive is required for that experience.',
              '`wait_for_turn()` remains Controller/turn-oriented and may return `controller_changed` immediately for a Human-controlled companion Seat. During the same active Agent run, an Advisor should instead repeat `wait_for_room_update(afterRoomSeq)` and may post `comment(text)` after relevant semantic events. Binding or connection still does not mean an ended Agent run is listening, so never promise background advice after final response.',
              "Agent guide Advisor behavior",
          )
          replace_once(
              "apps/web/public/agent.md",
              'get_turn()\nwait_for_turn(timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()',
              'get_turn()\nwait_for_turn(timeoutMs?)\nwait_for_room_update(afterRoomSeq, timeoutMs?)\nplay_move(expectedRevision, moveId)\ncomment(text)\nyield_to_bot()\ntake_control()',
              "Agent guide remote tools",
          )
