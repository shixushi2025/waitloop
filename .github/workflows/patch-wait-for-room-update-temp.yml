name: temporary wait_for_room_update patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/wait-for-room-update
          fetch-depth: 5

      - name: Recover and apply staged patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = ".github/workflows/patch-wait-for-room-update-temp.yml"
          staged_commit = "9ff013a9c9238d153c1bf3b83866dc356fa1475c"
          previous = subprocess.check_output(
              ["git", "show", f"{staged_commit}:{workflow_path}"],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in previous or end_marker not in previous:
              raise SystemExit("could not recover the staged Python patch")
          block = previous.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          script = "\n".join(lines) + "\n"

          ambiguous = '''              'get_turn()\\nwait_for_turn(timeoutMs?)\\nplay_move(expectedRevision, moveId)',
              'get_turn()\\nwait_for_turn(timeoutMs?)\\nwait_for_room_update(afterRoomSeq, timeoutMs?)\\nplay_move(expectedRevision, moveId)',
              "AGENTS local source tools",'''
          targeted = '''              'leave_room()\\nget_turn()\\nwait_for_turn(timeoutMs?)\\nplay_move(expectedRevision, moveId)',
              'leave_room()\\nget_turn()\\nwait_for_turn(timeoutMs?)\\nwait_for_room_update(afterRoomSeq, timeoutMs?)\\nplay_move(expectedRevision, moveId)',
              "AGENTS local source tools",'''
          if script.count(ambiguous) != 1:
              raise SystemExit("could not retarget the AGENTS local tool-list patch")
          script = script.replace(ambiguous, targeted, 1)
          Path("/tmp/waitloop-room-update-patch.py").write_text(script)
          PY

          python3 /tmp/waitloop-room-update-patch.py
          rm -f .wait-room-update-patch-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded Room update waiting"
          git push origin HEAD:fix/wait-for-room-update
