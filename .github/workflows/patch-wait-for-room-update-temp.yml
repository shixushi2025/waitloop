name: temporary wait_for_room_update patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/wait-for-room-update
          fetch-depth: 3

      - name: Recover and apply staged patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = ".github/workflows/patch-wait-for-room-update-temp.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{workflow_path}"],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in previous or end_marker not in previous:
              raise SystemExit("could not recover the staged Python patch from the previous commit")
          block = previous.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/waitloop-room-update-patch.py").write_text("\n".join(lines) + "\n")
          PY

          python3 /tmp/waitloop-room-update-patch.py
          rm -f .wait-room-update-patch-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded Room update waiting"
          git push origin HEAD:fix/wait-for-room-update
