name: publish-cli

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-cli-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout publish ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Validate browser JavaScript
        run: find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate CLI package contents
        run: pnpm check:cli-package

      - name: Validate publish source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const expected = `cli-v${pkg.version}`;
          if (process.env.EVENT_NAME === 'release') {
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}.`);
              process.exit(1);
            }
          } else if (pkg.version !== '0.1.0-alpha.2') {
            console.error(`Temporary main-branch OIDC validation is restricted to 0.1.0-alpha.2; found ${pkg.version}.`);
            process.exit(1);
          }
          const prerelease = pkg.version.match(/-([0-9A-Za-z-]+)/)?.[1];
          const distTag = prerelease ? prerelease.split('.')[0] : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          console.log(`Publishing @waitloop/cli@${pkg.version} with dist-tag ${distTag}.`);
          NODE

      - name: Check npm registry
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@waitloop/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@waitloop/cli@${VERSION} already exists; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @waitloop/cli with OIDC
        if: steps.registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Verify npm publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view "@waitloop/cli@${VERSION}" version 2>/dev/null || true)"
            if [ "$actual" = "$VERSION" ]; then
              echo "Verified @waitloop/cli@${VERSION} on npm."
              exit 0
            fi
            sleep 5
          done
          echo "npm registry did not expose @waitloop/cli@${VERSION} after publication." >&2
          exit 1

      - name: Mark alpha.2 published in public manifest
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/public/agent.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (manifest.cli.version !== '0.1.0-alpha.2') throw new Error('Unexpected manifest CLI version.');
          if (manifest.cli.published === true) process.exit(0);
          manifest.cli.published = true;
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          if git diff --quiet -- apps/web/public/agent.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/agent.json
          git commit -m "chore: mark CLI alpha.2 published"
          git push origin HEAD:main
