name: publish-cli

on:
  push:
    branches:
      - "publish/cli-v0.1.0-alpha.2"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-cli-alpha-2-retry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout publish branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Validate CLI package contents
        run: pnpm check:cli-package

      - name: Validate publish branch
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const expectedRef = `publish/cli-v${pkg.version}`;
          if (process.env.REF_NAME !== expectedRef) {
            throw new Error(`Expected ${expectedRef}, got ${process.env.REF_NAME}`);
          }
          const prerelease = pkg.version.match(/-([0-9A-Za-z-]+)/)?.[1];
          const distTag = prerelease ? prerelease.split('.')[0] : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          NODE

      - name: Check npm registry
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@waitloop/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @waitloop/cli with OIDC
        if: steps.registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Verify npm publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view "@waitloop/cli@${VERSION}" version 2>/dev/null || true)"
            if [ "$actual" = "$VERSION" ]; then
              echo "Verified @waitloop/cli@${VERSION} on npm."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Record verified publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          printf 'published @waitloop/cli@%s\ndist-tag %s\nauth oidc\n' "$VERSION" "$DIST_TAG" > .publish-cli-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .publish-cli-result
          git commit -m "chore: record CLI OIDC publish result" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
