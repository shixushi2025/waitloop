name: publish-cli

on:
  release:
    types: [published]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-cli-${{ github.event.release.tag_name || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Validate repository contract
        run: pnpm check:repo-contract

      - name: Validate browser JavaScript
        run: find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate CLI package contents
        run: pnpm check:cli-package

      - name: Validate packaged MCP stdio and App bridge
        run: pnpm check:mcp-stdio

      - name: Validate publication trigger
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('apps/web/public/agent.json', 'utf8'));

          if (process.env.EVENT_NAME === 'release') {
            const expected = `cli-v${pkg.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}.`);
              process.exit(1);
            }
          } else {
            const marker = fs.readFileSync('.github/publish-cli-alpha7', 'utf8').trim();
            const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });
            const originMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim();
            if (head !== process.env.WORKFLOW_HEAD_SHA || head !== originMain) {
              console.error(`Validated SHA ${head} must still be current origin/main ${originMain}.`);
              process.exit(1);
            }
            if (marker !== pkg.version || pkg.version !== '0.1.0-alpha.7') {
              console.error(`One-shot marker ${marker} does not authorize package ${pkg.version}.`);
              process.exit(1);
            }
            if (manifest.cli?.candidateVersion !== pkg.version || manifest.cli?.candidatePublished !== false) {
              console.error('agent.json must stage this unpublished candidate before trusted publication.');
              process.exit(1);
            }
            if (manifest.mcpApps?.status !== 'candidate-alpha.7') {
              console.error('agent.json must stage the MCP Apps candidate before publication.');
              process.exit(1);
            }
          }

          const prerelease = pkg.version.match(/-([0-9A-Za-z-]+)/)?.[1];
          const distTag = prerelease ? prerelease.split('.')[0] : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          console.log(`Publishing @waitloop/cli@${pkg.version} with dist-tag ${distTag}.`);
          NODE

      - name: Check npm registry
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@waitloop/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@waitloop/cli@${VERSION} already exists; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @waitloop/cli
        if: steps.registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Verify npm publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view "@waitloop/cli@${VERSION}" version 2>/dev/null || true)"
            if [ "$actual" = "$VERSION" ]; then
              echo "Verified @waitloop/cli@${VERSION} on npm."
              exit 0
            fi
            sleep 5
          done
          echo "npm registry did not expose @waitloop/cli@${VERSION} after publication." >&2
          exit 1

      - name: Validate clean npm installation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PREFIX="$RUNNER_TEMP/waitloop-alpha7"
          npm install --global --prefix "$PREFIX" "@waitloop/cli@${VERSION}"
          test "$("$PREFIX/bin/waitloop" --version)" = "$VERSION"
          "$PREFIX/bin/waitloop" --help | grep -F "waitloop mcp"
          "$PREFIX/bin/waitloop" --help | grep -F "waitloop room create"
          WAITLOOP_CLI_ENTRY="$PREFIX/lib/node_modules/@waitloop/cli/dist/index.js" node scripts/validate-mcp-stdio.mjs

      - name: Record one-shot publication result
        if: github.event_name == 'workflow_run'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf 'published-and-verified %s\n' "$VERSION" > .cli-alpha7-publish.result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .cli-alpha7-publish.result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record CLI alpha.7 publication"
          git push origin HEAD:main
