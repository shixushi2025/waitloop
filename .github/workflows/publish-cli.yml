name: publish-cli

on:
  push:
    branches:
      - release/cli-alpha8-one-shot

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-cli-alpha8-one-shot
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout one-shot release branch
        uses: actions/checkout@v4
        with:
          ref: release/cli-alpha8-one-shot

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Validate repository contract
        run: pnpm check:repo-contract

      - name: Validate browser JavaScript
        run: find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate CLI package contents
        run: pnpm check:cli-package

      - name: Validate packaged MCP stdio bridge
        run: pnpm check:mcp-stdio

      - name: Validate alpha.8 candidate
        id: release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('apps/web/public/agent.json', 'utf8'));
          if (pkg.version !== '0.1.0-alpha.8') throw new Error(`Expected alpha.8 package, found ${pkg.version}`);
          if (manifest.cli.version !== '0.1.0-alpha.7') throw new Error(`Expected alpha.7 published declaration before release, found ${manifest.cli.version}`);
          if (manifest.cli.candidateVersion !== pkg.version || manifest.cli.candidatePublished !== false) {
            throw new Error('agent.json must declare alpha.8 as an unpublished candidate before publication.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Check npm registry
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@waitloop/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@waitloop/cli@${VERSION} already exists; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @waitloop/cli alpha.8
        if: steps.registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance --tag alpha

      - name: Verify npm version and alpha dist-tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            exact="$(npm view "@waitloop/cli@${VERSION}" version 2>/dev/null || true)"
            alpha="$(npm view "@waitloop/cli@alpha" version 2>/dev/null || true)"
            if [ "$exact" = "$VERSION" ] && [ "$alpha" = "$VERSION" ]; then
              echo "Verified @waitloop/cli@${VERSION} and alpha dist-tag on npm."
              exit 0
            fi
            sleep 5
          done
          echo "npm registry/dist-tag did not converge to ${VERSION}." >&2
          exit 1

      - name: Validate clean alpha installation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PREFIX="$RUNNER_TEMP/waitloop-release"
          npm install --global --prefix "$PREFIX" "@waitloop/cli@alpha"
          test "$("$PREFIX/bin/waitloop" --version)" = "$VERSION"
          "$PREFIX/bin/waitloop" --help | grep -F "waitloop mcp"
          "$PREFIX/bin/waitloop" --help | grep -F "waitloop room create"
          WAITLOOP_CLI_ENTRY="$PREFIX/lib/node_modules/@waitloop/cli/dist/index.js" node scripts/validate-mcp-stdio.mjs

      - name: Record successful publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > .alpha8-published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .alpha8-published
          git commit -m "chore: record alpha.8 publication"
          git push origin HEAD:release/cli-alpha8-one-shot
