name: temporary bounded MCP App refresh patch

on:
  push:
    branches:
      - fix/mcp-app-bounded-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/mcp-app-bounded-refresh

      - name: Apply bounded refresh patch
        run: |
          python3 scripts/patch-mcp-app-bounded-refresh.py
          rm scripts/patch-mcp-app-bounded-refresh.py
          rm .github/workflows/patch-mcp-app-bounded-refresh-temp.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep MCP App refresh responsive and bounded"
          git push origin HEAD:fix/mcp-app-bounded-refresh
