name: temporary request polling patch

on:
  push:
    branches:
      - fix/request-polling-budget

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply request-polling patch
        run: |
          node scripts/patch-request-polling-temp.mjs
          rm scripts/patch-request-polling-temp.mjs
          rm .github/workflows/patch-request-polling-temp.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop idle Worker request loops"
          git push origin HEAD:fix/request-polling-budget
