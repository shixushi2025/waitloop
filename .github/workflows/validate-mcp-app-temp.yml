name: temporary MCP App validation

on:
  push:
    branches: [fix/mcp-app-human-table-verify2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop after result was recorded
        if: hashFiles('.mcp-app-ci.result') != ''
        run: |
          cat .mcp-app-ci.result
          exit 0

      - name: Setup pnpm
        if: hashFiles('.mcp-app-ci.result') == ''
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        if: hashFiles('.mcp-app-ci.result') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks and persist diagnostics
        if: hashFiles('.mcp-app-ci.result') == ''
        run: |
          set +e
          : > .mcp-app-ci.txt
          overall=0
          run_check() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" >> .mcp-app-ci.txt
            "$@" >> .mcp-app-ci.txt 2>&1
            rc=$?
            printf '\nexit=%s\n' "$rc" >> .mcp-app-ci.txt
            if test "$rc" -ne 0; then overall=1; fi
          }

          run_check "install frozen" pnpm install --frozen-lockfile
          if test "$overall" -eq 0; then
            run_check "typecheck and tests" pnpm check
            run_check "repository contract" pnpm check:repo-contract
            run_check "CLI package" pnpm check:cli-package
            run_check "MCP stdio wire" pnpm check:mcp-stdio
            run_check "browser JavaScript" bash -lc "find apps/web/public -name '*.js' -print0 | xargs -0 -n1 node --check"
            run_check "Agent discovery" bash -lc "test -s apps/web/public/agent.md && test -s apps/web/public/llms.txt && test -s apps/web/public/skills/waitloop/SKILL.md && node -e \"JSON.parse(require('node:fs').readFileSync('apps/web/public/agent.json', 'utf8'))\""
            run_check "Worker dry run" pnpm exec wrangler deploy --dry-run --outdir .wrangler-dist
          fi

          test "$overall" -eq 0 && echo passed > .mcp-app-ci.result || echo failed > .mcp-app-ci.result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .mcp-app-ci.result .mcp-app-ci.txt
          git commit -m "chore: record MCP App validation"
          git push origin HEAD:fix/mcp-app-human-table-verify2
          exit "$overall"
