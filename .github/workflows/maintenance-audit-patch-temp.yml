name: temporary maintenance audit patch

on:
  push:
    branches: [fix/maintenance-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: fix/maintenance-audit

      - name: Apply targeted maintenance fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/public/game.js",
              'import { historyDelta, recentHistory } from "./game-history.js";\n',
              'import { companionEmptyStateText } from "./companion-status.js";\nimport { historyDelta, recentHistory } from "./game-history.js";\n',
          )

          replace_once(
              "apps/web/public/game.js",
              '''function renderComments(current) {
            if (!isElement(companionSection) || !isElement(commentsElement)) return;
            const hasCompanion = Boolean(companionActor(current));
            const comments = Array.isArray(current.comments) ? current.comments.slice(-6) : [];
            companionSection.hidden = !hasCompanion && comments.length === 0;
            commentsElement.replaceChildren();
            if (comments.length === 0) {
              const empty = document.createElement("div");
              empty.className = "comment-empty";
              empty.textContent = hasCompanion ? "agent connected · no comments yet" : "no comments";
              commentsElement.append(empty);
              return;
            }
          ''',
              '''function renderComments(current) {
            if (!isElement(companionSection) || !isElement(commentsElement)) return;
            const companion = companionActor(current);
            const hasCompanion = Boolean(companion);
            const comments = Array.isArray(current.comments) ? current.comments.slice(-6) : [];
            companionSection.hidden = !hasCompanion && comments.length === 0;
            commentsElement.replaceChildren();
            if (comments.length === 0) {
              const empty = document.createElement("div");
              empty.className = "comment-empty";
              const companionState = companion ? actorStateFor(current, companion.id) : null;
              empty.textContent = companion
                ? companionEmptyStateText(companionState?.status)
                : "no comments";
              commentsElement.append(empty);
              return;
            }
          ''',
          )

          replace_once(
              "apps/web/public/game.js",
              '''  if (isElement(mcpClaimStatus) && state?.status === "connected") mcpClaimStatus.textContent = "agent connected";
            else if (isElement(mcpClaimStatus) && state?.status === "disconnected") mcpClaimStatus.textContent = "agent away · temporary control may continue";
            else if (isElement(mcpClaimStatus) && state?.status === "connecting") mcpClaimStatus.textContent = "credential claimed · waiting for MCP client";
          ''',
              '''  if (isElement(mcpClaimStatus) && state?.status === "connected") mcpClaimStatus.textContent = "agent connected";
            else if (isElement(mcpClaimStatus) && state?.status === "disconnected") mcpClaimStatus.textContent = "agent away · temporary control may continue";
            else if (isElement(mcpClaimStatus) && state?.status === "connecting") mcpClaimStatus.textContent = "credential claimed · waiting for MCP client";
            else if (isElement(mcpClaimStatus)) mcpClaimStatus.textContent = "waiting for agent";
          ''',
          )

          replace_once(
              "docs/architecture.md",
              "  -> typecheck / 88 tests\n",
              "  -> strict typecheck + full regression suite\n",
          )
          replace_once(
              "docs/architecture.md",
              "  get_turn / wait_for_turn / play_move / comment / yield / take_control\n",
              "  get_turn / wait_for_turn / wait_for_room_update / play_move / comment / yield / take_control\n",
          )
          replace_once(
              "docs/architecture.md",
              '''## Efficient waiting and polling

          Remote Agent `wait_for_turn`:

          ```text
          remote MCP handler
            -> GameRoom.getSnapshotBySeatToken
            -> classify actionable state
            -> bounded wait/poll (about 750 ms, max 25 s)
          ```

          This avoids model-driven tight polling without adding a Casual clock.

          The Human MCP App refreshes through app-only `ui_get_game` at about 1.2 seconds while active. This is UI state refresh, not a model loop and not a game timer.
          ''',
              '''## Efficient waiting and synchronization

          Remote Agent waits use the authenticated private snapshot:

          ```text
          wait_for_turn
            -> classify Controller/actionable-turn state

          wait_for_room_update(afterRoomSeq)
            -> classify semantic roomSeq advance or Room finish

          both
            -> bounded cancellable read loop (about 750 ms, max 25 s)
          ```

          These waits prevent model-driven tight polling without adding a Casual clock or background Agent scheduler.

          The Human-vs-bots MCP App is response-driven. Initial and mutation results carry authoritative snapshots, and `ui_get_game` is used only for explicit refresh, reopen/error recovery, and one-shot focus/visibility recovery. An idle mounted App performs no periodic Worker read.

          The standalone connected/companion Web table still uses bounded visible-document polling as a compatibility fallback while another Actor may change the Room. A future authorized push subscription will replace that fallback.
          ''',
          )

          replace_once(
              "docs/status.md",
              "### MCP App-only tools\n\nThe alpha.9 source candidate additionally exposes:\n",
              "### Alpha.9 candidate model-visible addition\n\nThe alpha.9 source candidate additionally exposes:\n",
          )
          replace_once(
              "docs/status.md",
              "- more than 110 unit/regression tests across rules, identity, controller fallback, lifecycle, CLI, MCP, Human MCP App custody/presentation, browser request budgets, Room event sequencing, and bounded Room-update waiting;\n",
              "The full regression suite covers:\n",
          )
          replace_once(
              "docs/status.md",
              "The currently tested companion flow remains fragmented: the Human creates `companion-agent` in standalone Web, relays a one-time Join code, and the Agent calls `join_room`. The bounded `wait_for_room_update` primitive now exists, but there is still no one-step local `open_companion_game` entry or push subscription transport.\n",
              "The currently tested companion flow remains fragmented: the Human creates `companion-agent` in standalone Web, relays a one-time Join code, and the Agent calls `join_room`. The bounded `wait_for_room_update` primitive now exists, but there is still no one-step local `open_companion_game` entry or push subscription transport. Companion empty-state copy now follows the authoritative Actor status, so waiting, connecting, connected, and disconnected states are not mislabeled.\n",
          )

          replace_once(
              "docs/README.md",
              "95 unit/regression tests\n",
              "full unit/regression suite, including Web request-budget coverage\n",
          )
          replace_once(
              "docs/README.md",
              "Agent discovery validation\nCloudflare gate self-test\n",
              "Agent discovery validation\ndocumentation and public-asset hygiene validation\nCloudflare gate self-test\n",
          )
          PY

          rm -f .github/workflows/maintenance-audit-patch-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply maintenance audit findings"
          git push origin HEAD:fix/maintenance-audit
