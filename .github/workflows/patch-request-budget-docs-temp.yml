name: temporary request-budget docs patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/request-polling-budget' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/request-polling-budget

      - name: Apply documentation patch
        run: |
          python3 scripts/patch-request-budget-docs-temp.py
          rm scripts/patch-request-budget-docs-temp.py
          rm .github/workflows/patch-request-budget-docs-temp.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: define browser request budgets"
          git push origin HEAD:fix/request-polling-budget
