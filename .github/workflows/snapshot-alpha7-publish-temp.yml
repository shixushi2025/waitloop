name: temporary alpha.7 publication snapshot 2

on:
  push:
    branches: [fix/alpha7-publish-snapshot2]

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: 88387ddafbbba215fd2029a69711f943b1504be9
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot checks and workflow runs
        run: |
          if test -f .alpha7-publish-snapshot2.json; then
            cat .alpha7-publish-snapshot2.json
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.TARGET_SHA;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'user-agent': 'waitloop-alpha7-snapshot2',
            'x-github-api-version': '2026-03-10',
          };
          async function read(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            return response.json();
          }
          const [checksBody, runsBody] = await Promise.all([
            read(`https://api.github.com/repos/shixushi2025/waitloop/commits/${sha}/check-runs?filter=all&per_page=100`),
            read(`https://api.github.com/repos/shixushi2025/waitloop/actions/runs?head_sha=${sha}&per_page=100`),
          ]);
          const snapshot = {
            version: 1,
            targetSha: sha,
            observedAt: new Date().toISOString(),
            checks: (checksBody.check_runs ?? []).map((run) => ({
              id: run.id,
              name: run.name,
              app: run.app?.slug,
              status: run.status,
              conclusion: run.conclusion,
              startedAt: run.started_at,
              completedAt: run.completed_at,
              detailsUrl: run.details_url,
            })),
            runs: (runsBody.workflow_runs ?? []).map((run) => ({
              id: run.id,
              name: run.name,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              htmlUrl: run.html_url,
            })),
          };
          fs.writeFileSync('.alpha7-publish-snapshot2.json', `${JSON.stringify(snapshot, null, 2)}\n`);
          console.log(JSON.stringify(snapshot, null, 2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .alpha7-publish-snapshot2.json
          git commit -m "chore: snapshot current alpha.7 publication state"
          git push origin HEAD:fix/alpha7-publish-snapshot2
